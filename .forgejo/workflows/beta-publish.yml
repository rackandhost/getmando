name: Beta publish

# Forgejo-only. Forgejo reads .forgejo/workflows INSTEAD of .github/workflows when it exists, and
# GitHub never reads .forgejo/, so this file cannot run on GitHub and the GitHub production
# pipeline (.github/workflows) cannot run on Forgejo.
on:
  workflow_dispatch:

# Two betas racing on the same moving `beta` tag would leave it pointing at the slower run.
concurrency:
  group: beta-publish
  cancel-in-progress: false

jobs:
  test:
    # Only `develop` is a beta source. This file also exists on `main` after a release.
    if: forgejo.ref == 'refs/heads/develop'
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci
      - run: npm run check:focused-tests
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build -- --configuration production

      # The sidecar under server/ typechecks against the shared dashboard.models.ts, so it needs
      # the root dependencies installed above.
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server

  publish:
    if: forgejo.ref == 'refs/heads/develop'
    needs: test
    runs-on: docker
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Registry host and image name follow the instance and the repository this runs on, so the
      # workflow carries no hard-coded host or owner.
      - name: Resolve image name and version
        id: vars
        run: |
          registry="${GITHUB_SERVER_URL#*://}"
          registry="${registry%%/*}"
          {
            echo "registry=${registry}"
            echo "image=${registry}/${GITHUB_REPOSITORY}"
            echo "version=v$(jq -r .version package.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # A personal access token (write:package), not the automatic job token: the automatic token
      # only reaches this repository, while registry packages belong to the owner.
      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.vars.outputs.registry }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=beta
            type=raw,value=${{ steps.vars.outputs.version }}-beta.${{ forgejo.run_number }}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache,mode=max
