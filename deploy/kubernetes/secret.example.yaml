# Example only — this file is deliberately NOT listed in kustomization.yaml, so `kubectl apply -k`
# never creates it and no placeholder token can ever reach a cluster from the repository. Either
# copy it with a strong token of your own, or create the Secret directly:
#
#   kubectl create secret generic getmando-config-write \
#     --from-literal=CONFIG_WRITE_TOKEN='<your-token>' -n getmando
#
# Without this Secret the deployment runs read-only: the dashboard serves, but the configurator's
# Save is rejected (POST /api/config returns 401).
apiVersion: v1
kind: Secret
metadata:
  name: getmando-config-write
  labels:
    app.kubernetes.io/name: getmando
    app.kubernetes.io/part-of: getmando
    app.kubernetes.io/component: dashboard
type: Opaque
stringData:
  CONFIG_WRITE_TOKEN: change-me
