apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: getmando
  labels:
    app.kubernetes.io/name: getmando
    app.kubernetes.io/part-of: getmando
    app.kubernetes.io/component: dashboard
spec:
  # Placeholder class: set your controller's class (e.g. `traefik` on k3s, `nginx` elsewhere).
  ingressClassName: nginx
  rules:
    # Placeholder host: replace with the hostname you serve the dashboard on.
    - host: getmando.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: getmando
                port:
                  name: http
