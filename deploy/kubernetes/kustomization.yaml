apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced resource lands in getmando (created by namespace.yaml).
namespace: getmando

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # secret.example.yaml is intentionally omitted: applying the base must never create a Secret.

# Pin the published image by digest, so an applied manifest runs exactly what was reviewed.
# Release tag: v2.1.0 — docker-publish.yml rewrites the tag and digest on every push to main.
images:
  - name: ghcr.io/rackandhost/getmando
    digest: sha256:990ce6bfa5d5823492cbef7f1f59c24c13ee042f229056c93950e63e6d6fdb35
