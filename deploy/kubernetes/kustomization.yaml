apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced resource lands in getmando (created by namespace.yaml).
namespace: getmando

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # secret.example.yaml is intentionally omitted: applying the base must never create a Secret.

# Pin the published image by digest, so an applied manifest runs exactly what was reviewed.
# Release tag: v2.0.0 — bump the digest by hand on each release (the tag here is for humans only).
images:
  - name: ghcr.io/rackandhost/getmando
    digest: sha256:5aa0c245b84d7768d5dea7d11bfc41a633177cbb832a50e9e57433d0b25a8bfc
