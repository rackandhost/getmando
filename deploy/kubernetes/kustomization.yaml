apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced resource lands in getmando (created by namespace.yaml).
namespace: getmando

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # secret.example.yaml is intentionally omitted: applying the base must never create a Secret.

# Pin the published image by digest, so an applied manifest runs exactly what was reviewed.
# Release tag: v2.1.1 — docker-publish.yml rewrites the tag and digest on every push to main.
images:
  - name: ghcr.io/rackandhost/getmando
    digest: sha256:a5ce378bed8bbbee329fc0a6aa68e21c771caccc74b39ba82775197ff78e56e0
