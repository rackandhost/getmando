name: Build and Publish Multi-Arch Docker Image to GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Serialize runs: each run commits the pinned digest back to main, and concurrent runs
# would race on that push.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      # The default GITHUB_TOKEN cannot push the digest-pin commit below: main is covered by a
      # ruleset requiring a pull request, and GITHUB_TOKEN has no bypass. Checking out with
      # KUBE_DIGEST_BOT_TOKEN (a classic PAT for the randhbot collaborator account, which IS a
      # ruleset bypass actor) persists that credential for every later git command in this job,
      # including the push.
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.KUBE_DIGEST_BOT_TOKEN }}

      - name: Get version from package.json
        id: pkg
        run: echo "version=v$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=sha,format=long

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the freshly pushed digest in the Kustomize base, so `kubectl apply -k` (or Flux/
      # Argo CD pointed at this repo) always runs exactly what this build produced. This push is
      # authenticated as randhbot (a real user, not GITHUB_TOKEN), so GitHub's loop prevention for
      # GITHUB_TOKEN-authored pushes does not apply here — [skip ci] in the commit message below
      # is the actual guard against re-triggering this workflow.
      - name: Pin image digest in Kubernetes manifests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          sed -i "s|digest: sha256:[0-9a-f]*|digest: ${DIGEST}|" deploy/kubernetes/kustomization.yaml
          sed -i "s|^# Release tag: v[0-9.]*|# Release tag: ${VERSION}|" deploy/kubernetes/kustomization.yaml
          sed -i "s|${REGISTRY}/${IMAGE_NAME}:v[0-9.]*|${REGISTRY}/${IMAGE_NAME}:${VERSION}|" deploy/kubernetes/deployment.yaml

          # Fail loudly if the manifests drift from these patterns instead of committing a no-op.
          grep -q "digest: ${DIGEST}" deploy/kubernetes/kustomization.yaml
          grep -q "# Release tag: ${VERSION}" deploy/kubernetes/kustomization.yaml
          grep -q "${REGISTRY}/${IMAGE_NAME}:${VERSION}" deploy/kubernetes/deployment.yaml

          git config user.name "randhbot"
          git config user.email "337729080+randhbot@users.noreply.github.com"
          git add deploy/kubernetes
          if git diff --cached --quiet; then
            echo "Digest ${DIGEST} already pinned; nothing to commit."
            exit 0
          fi
          git commit -m "chore(k8s): pin ${VERSION} image digest [skip ci]"
          # Detached-HEAD checkout: rebase onto the latest main, then push the branch explicitly.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
