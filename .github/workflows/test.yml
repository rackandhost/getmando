name: Test

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check focused tests
        run: npm run check:focused-tests

      - name: Run lint
        run: npm run lint

      - name: Check source formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Build production application
        run: npm run build -- --configuration production

      # deploy/kubernetes is declarative and has no unit tests, so this is its gate: build the
      # kustomization and validate every resource against the upstream Kubernetes OpenAPI schemas.
      # kubectl ships on the ubuntu-latest runner; kubeconform is pinned to v0.8.0 and its download
      # is checked against the release's published SHA-256 before extraction, so a compromised or
      # substituted binary fails the step instead of running inside the job. Nothing is skipped
      # (-strict, no -ignore-missing-schemas): the base contains no custom resources.
      - name: Validate Kubernetes manifests
        env:
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar xz -C /tmp -f /tmp/kubeconform.tar.gz
          kubectl kustomize deploy/kubernetes | /tmp/kubeconform -strict -

      # The config-write-api sidecar under server/ has its own package, but its
      # typecheck compiles the shared src/app/core/models/dashboard.models.ts and
      # so needs the root dependencies (zod) installed above.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Typecheck server
        run: npm run typecheck
        working-directory: server

      - name: Run server tests
        run: npm test
        working-directory: server
