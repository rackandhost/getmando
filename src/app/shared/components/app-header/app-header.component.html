<header class="p-6 md:p-8">
  <div class="flex flex-row items-center justify-between gap-4">
    <div class="flex gap-2">
      <img alt="getMando" class="w-16 h-16" src="img/mando.png" />

      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-neutral-800 dark:text-white mb-1">
          {{ metadata()?.title || 'Dashboard' }}
        </h1>

        <p class="text-base text-neutral-800/70 dark:text-white/70">
          {{ metadata()?.description || 'Your selfhosted applications' }}
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Configurator navigation -->
      <a
        [attr.aria-label]="navLabel()"
        class="flex h-11 w-11 items-center justify-center rounded-xl border border-white/20 bg-white/10 backdrop-blur-md transition-all duration-300 hover:bg-white/20 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-white/20 active:scale-95"
        [routerLink]="navTarget()"
      >
        <span aria-hidden="true" class="text-lg">{{ navIcon() }}</span>
      </a>

      <!-- Theme toggle button -->
      <button
        aria-label="Toggle theme"
        class="flex h-11 w-11 items-center justify-center rounded-xl border border-white/20 bg-white/10 backdrop-blur-md transition-all duration-300 hover:bg-white/20 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-white/20 active:scale-95"
        type="button"
        (click)="onToggleTheme()"
      >
        <span class="text-lg">{{ themeIcon() }}</span>
      </button>
    </div>
  </div>
</header>
