<header
  class="border-b border-line transition-[padding] duration-300"
  [attr.data-compact]="compact()"
  [style.padding-top.px]="paddingY()"
  [style.padding-bottom.px]="paddingY()"
>
  <div class="flex items-center justify-between gap-4">
    <div
      class="glass-chrome flex min-w-0 items-center gap-[14px] rounded-[18px] py-1.5 pl-1.5 pr-4 text-text"
    >
      <img alt="getMando" class="size-11 shrink-0 rounded-xl object-cover" src="img/mando.png" />

      <div class="min-w-0">
        <h1 class="truncate text-lg leading-tight font-semibold tracking-[-0.18px]">
          {{ metadata()?.title || 'Dashboard' }}
        </h1>

        <p class="truncate text-[13px] leading-tight text-muted">
          {{ metadata()?.description || 'Your selfhosted applications' }}
        </p>
      </div>
    </div>

    <div class="flex shrink-0 items-center gap-2">
      <!-- Configurator navigation -->
      <a
        [attr.aria-label]="navLabel()"
        class="glass-chrome flex h-11 items-center justify-center gap-2 rounded-xl text-text transition-transform active:scale-95"
        [class]="
          isConfiguratorRoute() ? 'min-w-11 px-3.5 max-[601px]:w-11 max-[601px]:px-0' : 'w-11'
        "
        [routerLink]="navTarget()"
      >
        <ng-icon aria-hidden="true" class="text-xl" [name]="navIcon()" />
        @if (isConfiguratorRoute()) {
          <!-- Visually hidden on phones; the link keeps its accessible name through aria-label. -->
          <span class="text-sm font-medium max-[601px]:sr-only">{{ navLabel() }}</span>
        }
      </a>

      <!-- Theme toggle button -->
      <button
        aria-label="Toggle theme"
        class="glass-chrome flex size-11 items-center justify-center rounded-xl text-text transition-transform active:scale-95"
        type="button"
        (click)="onToggleTheme()"
      >
        <ng-icon aria-hidden="true" class="text-xl" [name]="themeIcon()" />
      </button>
    </div>
  </div>
</header>
