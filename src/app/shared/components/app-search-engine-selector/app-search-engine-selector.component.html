<div class="app-search-engine-selector" (click)="close()">
  <button
    #trigger
    aria-haspopup="listbox"
    class="group flex h-11 shrink-0 items-center gap-2 rounded-[10px] bg-surface-2 px-3 text-sm font-medium text-text transition-[height,background-color] duration-300 group-data-[size=compact]/bar:h-8 group-data-[size=expanded]/bar:h-10 group-data-[variant=rail]/bar:w-full hover:bg-line disabled:cursor-default"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="'Select search engine, ' + scopeLabel()"
    [disabled]="validEngines().length === 0"
    (click)="toggle($event)"
    (keydown)="onTriggerKeydown($event)"
  >
    <ng-icon
      aria-hidden="true"
      class="text-xl [--ng-icon__color:var(--muted)] group-data-[variant=rail]/bar:shrink-0"
      name="heroMagnifyingGlass"
    />
    <span class="group-data-[variant=rail]/bar:min-w-0 group-data-[variant=rail]/bar:truncate">{{
      scopeLabel()
    }}</span>
    <ng-icon
      aria-hidden="true"
      class="text-base transition-transform [--ng-icon__color:var(--muted)] group-data-[variant=rail]/bar:shrink-0"
      name="heroChevronDown"
      [class.rotate-180]="isOpen()"
    />
  </button>

  @if (engines().length > 0 && isOpen()) {
    <ul
      aria-label="Search engines"
      class="absolute top-full left-1.5 z-20 mt-2 min-w-52 rounded-xl border border-line bg-menu p-1 text-text shadow-[var(--card-shadow)] backdrop-blur-xl"
      role="listbox"
      (keydown)="onListboxKeydown($event)"
    >
      <li
        #option
        class="flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm transition-colors hover:bg-surface-2 aria-selected:bg-surface-2"
        role="option"
        [attr.aria-selected]="selectedEngine() === null"
        [tabindex]="activeIndex() === 0 ? 0 : -1"
        (click)="select(null)"
        (keydown.enter)="select(null, $event)"
        (keydown.space)="select(null, $event)"
      >
        <ng-icon aria-hidden="true" name="heroMagnifyingGlass" />
        <span>Your apps</span>
        @if (selectedEngine() === null) {
          <ng-icon aria-hidden="true" class="ml-auto" name="heroCheck" />
        }
      </li>

      @for (engine of validEngines(); track engine.id; let index = $index) {
        <li
          #option
          class="flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm transition-colors hover:bg-surface-2 aria-selected:bg-surface-2"
          role="option"
          [attr.aria-selected]="selectedEngine()?.id === engine.id"
          [tabindex]="activeIndex() === index + 1 ? 0 : -1"
          (click)="select(engine)"
          (keydown.enter)="select(engine, $event)"
          (keydown.space)="select(engine, $event)"
        >
          <ng-icon aria-hidden="true" [name]="engine.icon" />
          <span>{{ engine.name }}</span>
          @if (selectedEngine()?.id === engine.id) {
            <ng-icon aria-hidden="true" class="ml-auto" name="heroCheck" />
          }
        </li>
      }
    </ul>
  }
</div>
