<button
  class="group flex min-h-11 w-full items-center justify-between gap-3 rounded-xl border border-line bg-surface-2 px-3.5 py-2 text-left text-sm font-medium text-text"
  role="switch"
  type="button"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="accessibleName() ?? null"
  [attr.data-checked]="checked()"
  [attr.id]="controlId() ?? null"
  (click)="checkedChange.emit(!checked())"
>
  <span>{{ label() }}</span>
  <!-- Track 44 × 26: the thumb's position, not only the accent fill, tells on from off. -->
  <span
    aria-hidden="true"
    class="relative h-[26px] w-11 shrink-0 rounded-full border border-field-border bg-field transition-colors duration-200 group-data-[checked=true]:border-accent group-data-[checked=true]:bg-accent"
  >
    <span
      class="absolute top-[2px] left-[2px] size-5 rounded-full bg-muted transition-[translate,background-color] duration-200 group-data-[checked=true]:translate-x-[18px] group-data-[checked=true]:bg-accent-ink"
    ></span>
  </span>
</button>
