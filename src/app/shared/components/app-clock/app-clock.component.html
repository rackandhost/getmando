<section
  class="flex justify-center transition-[padding] duration-300"
  [class]="compact() ? 'pt-3 pb-2.5' : 'pt-[clamp(32px,6vw,64px)] pb-[clamp(20px,3vw,32px)]'"
>
  <div
    class="glass-clock flex items-center rounded-[26px] text-text transition-[padding] duration-300"
    role="img"
    [attr.aria-label]="label()"
    [attr.data-compact]="compact()"
    [class]="
      compact()
        ? 'flex-row px-[22px] py-2.5'
        : 'flex-col gap-3 px-[clamp(28px,4vw,48px)] pt-[clamp(20px,2.5vw,28px)] pb-[clamp(18px,2.2vw,24px)]'
    "
  >
    @if (dateOnTop && !compact()) {
      <ng-container *ngTemplateOutlet="pills" />
    }

    <p
      class="flex items-baseline leading-none font-extrabold tracking-[-0.03em] transition-[font-size] duration-300"
      [class]="compact() ? 'text-[40px]' : 'text-[clamp(88px,11vw,150px)]'"
    >
      <span
        class="text-clock-ink"
        [class]="compact() ? '[-webkit-text-stroke:1px_var(--clock-ink)]' : ''"
        >{{ parts().hours }}</span
      >
      <span class="px-[0.06em] text-accent">:</span>
      <span
        class="text-minute-fill"
        [class]="
          compact()
            ? '[-webkit-text-stroke:1.2px_var(--accent)]'
            : '[-webkit-text-stroke:2px_var(--accent)]'
        "
        >{{ parts().minutes }}</span
      >
      @if (showSeconds) {
        <span
          aria-hidden="true"
          class="ml-[0.12em] font-mono text-[max(14px,0.18em)] font-semibold tracking-normal text-muted tabular-nums"
          >{{ parts().seconds }}</span
        >
      }
    </p>

    @if (dateOnBottom || (dateOnTop && compact())) {
      <ng-container *ngTemplateOutlet="pills" />
    }
  </div>
</section>

<ng-template #pills>
  <div
    class="flex items-center justify-center gap-2 font-mono text-xs font-semibold tracking-[0.16em]"
    [class]="compact() ? 'ml-4 border-l border-line pl-4' : ''"
  >
    <span class="rounded-full bg-accent px-[11px] py-[5px] text-accent-ink">{{
      parts().weekday | uppercase
    }}</span>
    <span class="rounded-full border border-pill-line bg-pill-bg px-[11px] py-[5px] text-text">{{
      parts().date | uppercase
    }}</span>
  </div>
</ng-template>
