<button
  #trigger
  aria-haspopup="dialog"
  class="glass-chrome flex size-11 items-center justify-center rounded-xl text-text transition-transform active:scale-95"
  title="Theme"
  type="button"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="'Change theme, current: ' + committedName()"
  (click)="show()"
>
  <ng-icon aria-hidden="true" class="text-xl" name="heroSwatch" />
</button>

<dialog
  #dialog
  aria-label="Choose a theme"
  class="m-0 mx-auto mt-[14vh] max-h-[calc(100dvh-14vh-16px)] w-[calc(100%-32px)] max-w-[560px] flex-col overflow-hidden rounded-[20px] border border-chrome-line bg-menu p-0 text-text shadow-[var(--glass-shadow),0_30px_80px_rgba(0,0,0,0.45)] backdrop-blur-[28px] backdrop-saturate-[1.6] open:flex backdrop:bg-black/32 backdrop:backdrop-blur-[6px]"
  (click)="onDialogClick($event)"
  (close)="onClosed()"
  (keydown)="onDialogKeydown($event)"
  (mousedown)="onDialogMouseDown($event)"
>
  <!-- The focus ring marks the whole row, drawn inside it because the dialog clips what falls outside. -->
  <div
    class="flex h-[60px] shrink-0 items-center gap-3 rounded-t-[19px] border-b border-line px-[18px] has-[input:focus-visible]:shadow-[inset_0_0_0_4px_var(--focus-halo)] has-[input:focus-visible]:outline-2 has-[input:focus-visible]:-outline-offset-2 has-[input:focus-visible]:outline-focus"
  >
    <ng-icon aria-hidden="true" class="shrink-0 text-xl text-muted" name="heroMagnifyingGlass" />
    <label class="sr-only" [for]="searchId">Search themes</label>
    <input
      #searchField
      aria-autocomplete="list"
      aria-expanded="true"
      autocomplete="off"
      class="h-11 min-w-0 flex-1 bg-transparent text-lg text-text placeholder:text-muted focus-visible:[box-shadow:none]! focus-visible:outline-none!"
      placeholder="Search themes…"
      role="combobox"
      type="text"
      [attr.aria-activedescendant]="highlighted() ? optionId(highlighted()!) : null"
      [attr.aria-controls]="listId"
      [id]="searchId"
      [value]="query()"
      (input)="setQuery($event)"
      (keydown)="onSearchKeydown($event)"
    />
    <button
      #closeButton
      aria-label="Close"
      class="h-[26px] shrink-0 rounded-md border border-line bg-surface-2 px-2 font-mono text-[11px] font-medium tracking-[0.06em] text-muted"
      type="button"
      (click)="close()"
    >
      ESC
    </button>
  </div>

  <div class="min-h-0 flex-1 overflow-y-auto">
    <p
      aria-hidden="true"
      class="px-5 pt-3.5 pb-1.5 font-mono text-[11px] font-medium tracking-[0.14em] text-muted uppercase"
    >
      Themes
    </p>
    <ul
      aria-label="Themes"
      class="m-0 list-none px-2.5 pt-1 pb-2.5"
      role="listbox"
      [hidden]="rows().length === 0"
      [id]="listId"
    >
      @for (row of rows(); track row.id) {
        <!-- Keyboard operation lives on the search field (aria-activedescendant); options are not focusable. -->
        <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
        <li
          class="grid min-h-[60px] cursor-pointer grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-x-3.5 rounded-xl border border-transparent px-3 transition-colors duration-150 max-[480px]:grid-cols-[auto_minmax(0,1fr)] max-[480px]:py-1.5 motion-reduce:transition-none aria-selected:border-chrome-line aria-selected:bg-surface-2"
          role="option"
          [attr.aria-describedby]="describedBy(row.id)"
          [attr.aria-labelledby]="optionId(row.id, 'name')"
          [attr.aria-selected]="row.id === highlighted()"
          [id]="optionId(row.id)"
          (click)="choose(row.id)"
          (mousemove)="highlight.set(row.id)"
        >
          <app-theme-preview class="max-[480px]:row-span-2" size="sm" [swatches]="row.swatches" />
          <span class="flex min-w-0 flex-1 flex-col gap-0.5">
            <span class="text-[15px] font-semibold" [id]="optionId(row.id, 'name')">{{
              row.name
            }}</span>
            <span class="text-[13px] text-muted" [id]="optionId(row.id, 'description')">{{
              row.description
            }}</span>
          </span>
          @if (row.id === committed()) {
            <span
              class="inline-flex h-6 shrink-0 items-center gap-1.5 rounded-full bg-accent px-[9px] font-mono text-[11px] font-semibold tracking-[0.08em] text-accent-ink uppercase max-[480px]:col-start-2 max-[480px]:mt-1.5 max-[480px]:justify-self-start"
              [id]="optionId(row.id, 'active')"
            >
              <ng-icon aria-hidden="true" class="text-xs" name="heroCheck" />Active
            </span>
          }
        </li>
      }
    </ul>
    <p class="m-0 px-5 py-[18px] text-sm text-muted" role="status" [hidden]="rows().length > 0">
      @if (rows().length === 0) {
        No themes match your search.
      }
    </p>
  </div>

  <div
    class="flex shrink-0 flex-wrap gap-x-4 gap-y-1.5 border-t border-line px-5 py-3 font-mono text-xs text-muted"
  >
    <span>↑ ↓ preview</span><span>↵ apply</span><span>esc cancel</span>
  </div>
</dialog>
