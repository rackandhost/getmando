<div
  class="glass-chrome relative mb-6 flex h-[60px] w-full items-center gap-2 rounded-2xl pl-1.5 pr-2 text-text has-[input:focus-visible]:outline-2 has-[input:focus-visible]:outline-offset-0 has-[input:focus-visible]:outline-text"
>
  <app-search-engine-selector
    [engines]="availableEngines()"
    [selectedEngine]="currentEngine()"
    (engineSelected)="onSelectEngine($event)"
  />

  <input
    aria-label="Search applications"
    class="h-full min-w-0 flex-1 bg-transparent px-2 text-base text-text placeholder:text-muted focus-visible:[box-shadow:none]! focus-visible:outline-none! [&::-webkit-search-cancel-button]:hidden [&::-webkit-search-cancel-button]:appearance-none"
    type="search"
    (input)="onSearchInput($event)"
    (keyup.enter)="onSearchEnter()"
    [placeholder]="inputPlaceholder"
    [value]="searchQuery()"
  />

  @if (haveSearch()) {
    <button
      aria-label="Clear search"
      class="flex size-9 shrink-0 items-center justify-center rounded-[10px] text-muted transition-colors hover:text-text"
      type="button"
      (click)="onHandleResetSearch()"
    >
      <ng-icon aria-hidden="true" class="text-xl" name="heroXMark" />
    </button>

    <button
      aria-label="Search"
      class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-accent text-accent-ink transition-transform active:scale-95"
      type="button"
      (click)="onSearchEnter()"
    >
      <ng-icon aria-hidden="true" class="text-xl" name="heroArrowRight" />
    </button>
  }
</div>
