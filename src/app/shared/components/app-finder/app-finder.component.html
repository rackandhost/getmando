<div
  class="group/bar relative z-10 flex w-full items-center text-text transition-[height,max-width,margin-bottom,box-shadow] duration-300 ease-out has-[input:focus-visible]:outline-2 has-[input:focus-visible]:outline-offset-2 has-[input:focus-visible]:outline-focus"
  [attr.data-compact]="dockCompact()"
  [attr.data-expanded]="expanded()"
  [attr.data-size]="size()"
  [attr.data-variant]="variant()"
  [class]="variantClass()"
  (focusin)="onFocusIn($event)"
  (focusout)="onFocusOut($event)"
>
  <app-search-engine-selector
    [engines]="availableEngines()"
    [selectedEngine]="currentEngine()"
    (engineSelected)="onSelectEngine($event)"
    (openChange)="menuOpen.set($event)"
    [class.min-w-0]="variant() === 'rail'"
  />

  <input
    aria-label="Search applications"
    class="h-full min-w-0 flex-1 bg-transparent px-2 text-base text-text placeholder:text-muted group-data-[variant=rail]/bar:min-w-[72px] focus-visible:[box-shadow:none]! focus-visible:outline-none! [&::-webkit-search-cancel-button]:hidden [&::-webkit-search-cancel-button]:appearance-none"
    type="search"
    (input)="onSearchInput($event)"
    (keyup.enter)="onSearchEnter()"
    [placeholder]="inputPlaceholder"
    [value]="searchQuery()"
  />

  @if (haveSearch()) {
    <button
      aria-label="Clear search"
      class="flex size-9 shrink-0 items-center justify-center rounded-[10px] text-muted transition-[width,height,color] duration-300 group-data-[size=expanded]/bar:size-8 group-data-[variant=rail]/bar:size-8 hover:text-text"
      type="button"
      (click)="onHandleResetSearch()"
    >
      <ng-icon aria-hidden="true" class="text-xl" name="heroXMark" />
    </button>

    <button
      aria-label="Search"
      class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-accent text-accent-ink transition-[transform,width,height] duration-300 group-data-[size=expanded]/bar:size-10 group-data-[variant=rail]/bar:size-10 active:scale-95"
      type="button"
      (click)="onSearchEnter()"
    >
      <ng-icon aria-hidden="true" class="text-xl" name="heroArrowRight" />
    </button>
  }
</div>
