<section
  class="glass-card relative scroll-mt-[var(--section-margin,20px)] rounded-[18px] p-7 has-[[aria-haspopup=listbox][aria-expanded=true]]:z-20"
  [attr.aria-labelledby]="headingId()"
  [id]="id()"
>
  <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-3">
    <div class="flex items-baseline gap-4">
      @if (number()) {
        <!-- Mixed towards the text colour: the stuck chrome's shadow darkens the card under it, and plain
             accent measured 4.3 : 1 there (WCAG 1.4.3). -->
        <span
          aria-hidden="true"
          class="font-mono text-[13px] font-medium text-[color-mix(in_srgb,var(--accent)_70%,var(--text))]"
          >{{ number() }}</span
        >
      }
      <div>
        <h2 class="text-[19px] font-semibold text-text" tabindex="-1" [id]="headingId()">
          {{ title() }}
        </h2>
        @if (description()) {
          <p class="mt-1.5 text-sm text-muted" [class.max-w-160]="narrowDescription()">
            {{ description() }}
          </p>
        }
      </div>
    </div>
    <ng-content select="[sectionAction]" />
  </div>

  <div class="mt-6">
    <ng-content />
  </div>
</section>
